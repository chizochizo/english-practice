<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakFlow — AI Language Tutor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --user-bubble: #312e81;
      --ai-bubble: #334155;
      --border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      outline: none;
      max-width: 220px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-bubble);
      color: #e0e7ff;
      border-bottom-right-radius: 2px;
    }

    .message.ai {
      align-self: flex-start;
      background-color: var(--ai-bubble);
      color: var(--text);
      border-bottom-left-radius: 2px;
    }

    .status-indicator {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1.2em;
    }

    footer {
      background-color: var(--card);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-mic {
      background-color: #0284c7;
    }

    .btn-mic:hover {
      background-color: #0369a1;
    }

    .btn-mic.recording {
      background-color: #ef4444;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🎙️</span> SpeakFlow
    </div>
    <div class="controls">
      <label for="voiceSelect">Tutor Voice:</label>
      <select id="voiceSelect"></select>
    </div>
  </header>

  <main id="chatLog">
    <div class="message ai">
      Hello! I'm your English tutor. What topic would you like to practice today?
    </div>
  </main>

  <div class="status-indicator" id="statusText"></div>

  <footer>
    <button id="micBtn" class="btn-mic" type="button" title="Speak via microphone">🎤 Talk</button>
    <input type="text" id="userInput" placeholder="Type or click Talk to practice..." autocomplete="off" />
    <button id="sendBtn" type="button">Send</button>
  </footer>

  <script>
    const BACKEND_URL = "https://speakflow-proxy.chizovechikho.workers.dev";
    const SYSTEM_PROMPT = "You are a friendly, encouraging English conversation tutor. Respond naturally in 1-2 punchy sentences. Correct minor grammatical mistakes gently if necessary, and always prompt the learner to keep the conversation flowing.";

    let conversation = [
      { sender: "AI", text: "Hello! I'm your English tutor. What topic would you like to practice today?" }
    ];

    const chatLog = document.getElementById("chatLog");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const statusText = document.getElementById("statusText");
    const voiceSelect = document.getElementById("voiceSelect");

    let availableVoices = [];

    // --- Voice Management ---
    function loadVoices() {
      availableVoices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
      voiceSelect.innerHTML = "";

      if (availableVoices.length === 0) {
        const opt = document.createElement("option");
        opt.textContent = "Default Browser Voice";
        voiceSelect.appendChild(opt);
        return;
      }

      availableVoices.forEach((voice, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (voice.name.includes("Natural") || voice.name.includes("Google") || voice.default) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });
    }

    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      const selectedIndex = parseInt(voiceSelect.value, 10);
      if (availableVoices[selectedIndex]) {
        utterance.voice = availableVoices[selectedIndex];
      }
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // --- Chat Rendering ---
    function appendMessage(sender, text) {
      const bubble = document.createElement("div");
      bubble.className = `message ${sender === "You" ? "user" : "ai"}`;
      bubble.textContent = text;
      chatLog.appendChild(bubble);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // --- Handle Sending Messages ---
    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("You", text);
      conversation.push({ sender: "You", text });
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;
      statusText.textContent = "Tutor is thinking...";

      try {
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_prompt: SYSTEM_PROMPT,
            messages: conversation
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const reply = data.reply || "Sorry, I couldn't process that.";

        appendMessage("AI", reply);
        conversation.push({ sender: "AI", text: reply });
        speakText(reply);
      } catch (err) {
        appendMessage("AI", "Could not reach the server. Please verify the Cloudflare Worker setup.");
        console.error(err);
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        statusText.textContent = "";
        userInput.focus();
      }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    // --- Browser Speech Recognition (STT) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add("recording");
        micBtn.textContent = "🛑 Listening...";
        statusText.textContent = "Listening to your voice...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        handleSend();
      };

      recognition.onerror = () => {
        statusText.textContent = "Microphone error or permission denied.";
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎤 Talk";
        if (statusText.textContent === "Listening to your voice...") {
          statusText.textContent = "";
        }
      };

      micBtn.addEventListener("click", () => {
        if (isRecording) {
          recognition.stop();
        } else {
          window.speechSynthesis.cancel();
          recognition.start();
        }
      });
    } else {
      micBtn.style.display = "none";
    }
  </script>
</body>
</html>
